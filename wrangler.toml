name = "notes-app"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Serves the Vite build output directly; requests that don't match a
# static file (like /api/*) fall through to src/worker.js.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Required encrypted secrets. Wrangler will validate that these are present
# when deploying instead of allowing a broken auth deployment to go live.
[secrets]
required = ["APP_PASSWORD", "SESSION_SECRET"]

# D1 database binding used by src/server/notes.js.
[[d1_databases]]
binding = "NOTES_DB"
database_name = "notes-db"
database_id = "6cca19c5-7743-4284-98f1-e190914b4641"
