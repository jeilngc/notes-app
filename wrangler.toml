name = "notes-app"
compatibility_date = "2024-09-23"


# D1 database binding used by functions/api/notes/*.
# Create the database with `wrangler d1 create notes-db`, then paste the
# printed database_id below (and add the same binding in the Cloudflare
# Pages dashboard under Settings -> Functions -> D1 database bindings).
[[d1_databases]]
binding = "DB"
database_name = "notes-db"
database_id = "6cca19c5-7743-4284-98f1-e190914b4641"
