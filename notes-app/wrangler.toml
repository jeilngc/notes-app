name = "notes-app"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Serves the Vite build output directly; requests that don't match a
# static file (like /api/*) fall through to src/worker.js.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 database binding used by src/server/notes.js.
# Create the database with `wrangler d1 create notes-db`, then paste the
# printed database_id below (this also needs to match the D1 binding
# added in the Cloudflare dashboard under this Worker's Settings -> Bindings).
[[d1_databases]]
binding = "NOTES_DB"
database_name = "notes-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
